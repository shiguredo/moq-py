[package]
name = "moqt-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Python bindings for Media over QUIC Transport"
readme = "README.md"
repository = "https://github.com/shiguredo/moqt-py"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Python バインディングと型スタブ生成用の introspection
pyo3 = { version = "0.29", features = ["extension-module", "experimental-inspect"] }
# MoQT の Sans I/O codec と Session 状態機械
# 公開リポジトリにタグ付けされたリリースがまだ存在しないため、開発ブランチの
# 特定コミットに固定する。リリースタグが作成されたら tag 指定へ切り替える
shiguredo_moqt = { git = "https://github.com/shiguredo/moqt-rs.git", rev = "5ddd5142b728f2bac2120827cc85bbb183c234c6" }
