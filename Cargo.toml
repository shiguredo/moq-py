[package]
name = "moq-py"
version = "2026.0.0"
edition = "2024"
rust-version = "1.93"
description = "Python client and server library for Media over QUIC over WebTransport"
readme = "README.md"
repository = "https://github.com/shiguredo/moq-py"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Python バインディングと型スタブ生成用の introspection
pyo3 = { version = "0.29", features = [
  "extension-module",
  "experimental-inspect"
] }
# MoQT の Sans I/O codec と Session 状態機械
# 公開リポジトリにタグ付けされたリリースがまだ存在しないため develop ブランチを
# 追従する。実際にビルドしたコミットは Cargo.lock が固定する。最新へ更新するときは
# `cargo update -p shiguredo_moqt` を実行する。リリースタグが作成されたら tag 指定へ
# 切り替える
shiguredo_moqt = { git = "https://github.com/shiguredo/moqt-rs.git", branch = "develop" }
