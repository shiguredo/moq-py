[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "moq-py"
version = "2026.0.0"
description = "Python client and server library for Media over QUIC over WebTransport"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Rust",
]
dependencies = [
  # WebTransport over HTTP/3 の asyncio I/O
  "webtransport-py>=2026.1.0.dev18,<2026.2",
]

[project.optional-dependencies]
# 他プロジェクトのテストから moq.testing の fixture を使うための依存
testing = [
  # moq.testing の pytest fixture
  "pytest>=9.0,<10",
  # moq.testing の非同期 fixture
  "pytest-asyncio>=1.4,<2",
  # moq.testing.generate_certificates の自己署名証明書生成
  "cryptography>=50.0,<51",
]

[dependency-groups]
dev = [
  # Rust extension の開発ビルドと型スタブ生成
  "maturin>=1.14.1,<2.0",
  # テスト実行と非同期テスト
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-timeout>=2.4,<3",
  # SETUP の任意分割を検証する Property-Based Testing
  "hypothesis>=6.140,<7",
  # 実通信テスト用の自己署名証明書生成
  "cryptography>=50.0,<51",
  # Python の format / lint / 型検査
  "ruff",
  "ty",
]

[tool.maturin]
python-source = "python"
module-name = "moq._native"
manifest-path = "Cargo.toml"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["python/moq/_native.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "ANN", "RUF"]
ignore = []

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--timeout=10"]
testpaths = ["tests"]
python_files = ["test_*.py", "prop_*.py"]
python_functions = ["test_*", "prop_*"]
asyncio_mode = "auto"

[tool.ty]

[tool.tombi]
[tool.tombi.schema]
enabled = false

[tool.tombi.files]
exclude = ["uv.lock", "target/**", "dist/**", ".venv/**"]
